<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#000000" />
  <!-- Basic Meta Tags -->
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description"
    content="Campus Eats - A food delivery platform for students to order from local shops and restaurants." />

  <!-- Social Media Meta Tags (Open Graph for Facebook, Twitter Card) -->
  <meta property="og:title" content="Campus Eats - Food Delivery Platform" />
  <meta property="og:description"
    content="Campus Eats allows students to easily order food from local restaurants with secure payment options." />
  <meta property="og:image" content="%PUBLIC_URL%/logo192.png" />
  <meta property="og:url" content="https://campuseats.netlify.app" />
  <meta property="og:type" content="website" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Campus Eats - Food Delivery Platform" />
  <meta name="twitter:description" content="Order food easily from local shops and restaurants with secure payments." />
  <meta name="twitter:image" content="%PUBLIC_URL%/logo192.png" />


  <!-- Additional Meta Tags for SEO -->
  <meta name="keywords" content="food delivery, campus eats, student food ordering, local restaurants, food platform" />
  <meta name="author" content="Tushar Saini" />
  <meta name="robots" content="index, follow" />

  <!-- Icon -->
  <link rel="icon" href="%PUBLIC_URL%/favicon.ico" sizes="64x64 32x32 24x24 16x16" type="image/x-icon" />
  <link rel="apple-touch-icon" href="%PUBLIC_URL%/logo192.png" />
  <link rel="apple-touch-icon" sizes="512x512" href="%PUBLIC_URL%/logo512.png" />
  <link rel="icon" href="%PUBLIC_URL%/favicon-16x16.png" sizes="16x16" type="image/png" />
  <link rel="icon" href="%PUBLIC_URL%/favicon-32x32.png" sizes="32x32" type="image/png" />
  
  <!--
      manifest.json provides metadata used when your web app is installed on a
      user's mobile device or desktop. See https://developers.google.com/web/fundamentals/web-app-manifest/
    -->
  <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
  <!--
      Notice the use of %PUBLIC_URL% in the tags above.
      It will be replaced with the URL of the `public` folder during the build.
      Only files inside the `public` folder can be referenced from the HTML.

      Unlike "/favicon.ico" or "favicon.ico", "%PUBLIC_URL%/favicon.ico" will
      work correctly both with client-side routing and a non-root public URL.
      Learn how to configure a non-root public URL by running `npm run build`.
    -->
  <title>CampusEats</title>
</head>
